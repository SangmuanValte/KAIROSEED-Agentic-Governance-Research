name: Licensing manifest checks

on:
  pull_request:
    paths:
      - "licensing/**"
      - "tools/validate_licensing_manifest.py"
      - "tests/test_licensing_manifest.py"
      - ".github/workflows/licensing.yml"
  push:
    branches: [main]
    paths:
      - "licensing/**"
      - "tools/validate_licensing_manifest.py"
      - "tests/test_licensing_manifest.py"
      - ".github/workflows/licensing.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run licensing validator tests
        run: python -m unittest discover -s tests -p 'test_licensing_manifest.py' -v
      - name: Validate tracked path classification
        run: git ls-files -z | python tools/validate_licensing_manifest.py --stdin
